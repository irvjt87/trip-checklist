<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Trip Checklist">
  <title>Multi-Trip Manager with Reordering</title>

  <!-- Standard SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e293b'/><text x='50%' y='68%' font-size='60' text-anchor='middle'>🧳</text></svg>">

  <!-- Static iOS Touch Icon -->
  <link rel="apple-touch-icon" href="data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' fill='%231e293b'/><text x='50%' y='68%' font-size='110' text-anchor='middle'>🧳</text></svg>">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #e0e0e0; padding: 10px; max-width: 480px; margin: 0 auto; font-size: 13px; }
    
    /* Header Controls */
    .bar { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
    select, input, button { font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid #333; background: #1e1e1e; color: #fff; outline: none; }
    select { flex: 1; font-weight: bold; background: #2a2a2a; }
    .btn { background: #2c6bed; color: white; border: none; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-subtle { background: #2a2a2a; color: #aaa; border: 1px solid #333; }
    
    /* Add Form */
    .add-form { display: flex; flex-direction: column; gap: 4px; background: #1e1e1e; padding: 6px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #2a2a2a; }
    .add-form-row { display: flex; gap: 4px; }
    .add-form select[name="category"] { width: 100px; font-weight: normal; background: #2a2a2a; }
    .add-form input[name="name"] { flex: 1; }
    .add-form input[name="notes"] { flex: 1; font-size: 12px; color: #ccc; }
    
    /* List Layout */
    .list { display: flex; flex-direction: column; gap: 4px; }
    .row { display: flex; align-items: center; gap: 6px; background: #1e1e1e; padding: 6px 8px; border-radius: 6px; border-left: 3px solid #00e676; }
    .row.completed { border-left-color: #444; opacity: 0.45; }
    
    /* Item Details */
    .item-details { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .item-header { display: flex; align-items: center; gap: 6px; overflow: hidden; }
    .item-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .item-notes { font-size: 11px; color: #aaa; word-break: break-word; line-height: 1.25; }
    .category-badge { font-family: monospace; font-weight: bold; font-size: 10px; background: #2a2a2a; color: #ffb74d; padding: 1px 4px; border-radius: 3px; flex-shrink: 0; }
    
    /* Reorder Buttons */
    .reorder { display: flex; flex-direction: column; gap: 1px; flex-shrink: 0; }
    .reorder-btn { background: #2a2a2a; border: 1px solid #333; color: #ccc; padding: 1px 4px; font-size: 9px; border-radius: 3px; cursor: pointer; line-height: 1; }
    .reorder-btn:disabled { opacity: 0.2; cursor: default; }

    /* Toggle Switch */
    .toggle { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; border: none; cursor: pointer; min-width: 55px; text-align: center; flex-shrink: 0; }
    .toggle.pending { background: #00e676; color: #000; }
    .toggle.done { background: #333; color: #888; }
    
    .actions { display: flex; gap: 2px; flex-shrink: 0; }
    .icon-btn { background: none; border: none; color: #888; padding: 2px 4px; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Trip Switcher & Management -->
  <div class="bar">
    <select id="tripSelect" onchange="switchTrip()"></select>
    <button class="btn" onclick="addTrip()">+ Trip</button>
    <button class="btn-subtle" onclick="renameTrip()">✏️</button>
    <button class="btn-subtle" onclick="deleteTrip()">🗑️</button>
  </div>

  <!-- Add Item Form -->
  <form class="add-form" onsubmit="addItem(event)">
    <div class="add-form-row">
      <select id="newCategory" name="category">
        <option value="General">General</option>
        <option value="Logistics">Logistics</option>
        <option value="Activities">Activities</option>
        <option value="Gear">Gear</option>
        <option value="Shopping">Shopping</option>
        <option value="Lodging">Lodging</option>
        <option value="Docs">Docs</option>
      </select>
      <input type="text" id="newName" name="name" placeholder="Item / Activity Name..." required autocomplete="off">
      <button type="submit" class="btn">Add</button>
    </div>
    <div class="add-form-row">
      <input type="text" id="newNotes" name="notes" placeholder="Optional address / comments..." autocomplete="off">
    </div>
  </form>

  <!-- Items List Container -->
  <div id="itemList" class="list"></div>

  <script>
    // System Data Architecture
    let db = JSON.parse(localStorage.getItem('trip_checklist_db')) || {
      activeTrip: "Springfield / Branson Trip",
      trips: {
        "Springfield / Branson Trip": [
          { id: 1, name: "Cabin Rental Confirmation", category: "Lodging", notes: "123 Timber Lane, Branson, MO", completed: false, priority: 1 },
          { id: 2, name: "Silver Dollar City Tickets", category: "Activities", notes: "Order #88391 - Gate opens 9 AM", completed: false, priority: 2 },
          { id: 3, name: "Trout Fishing Rods & Tackle", category: "Gear", notes: "", completed: false, priority: 3 },
          { id: 4, name: "Bass Pro Shops Stop List", category: "Shopping", notes: "Springfield flagship store", completed: true, priority: 4 }
        ]
      }
    };

    function save() {
      localStorage.setItem('trip_checklist_db', JSON.stringify(db));
    }

    function init() {
      const select = document.getElementById('tripSelect');
      select.innerHTML = '';
      const tripNames = Object.keys(db.trips);

      if (tripNames.length === 0) {
        db.trips["My First Trip"] = [];
        db.activeTrip = "My First Trip";
      } else if (!db.trips[db.activeTrip]) {
        db.activeTrip = tripNames[0];
      }

      Object.keys(db.trips).forEach(trip => {
        const opt = document.createElement('option');
        opt.value = trip;
        opt.textContent = trip;
        if (trip === db.activeTrip) opt.selected = true;
        select.appendChild(opt);
      });
      renderList();
    }

    function switchTrip() {
      db.activeTrip = document.getElementById('tripSelect').value;
      save();
      renderList();
    }

    function addTrip() {
      const name = prompt("Enter new trip name:");
      if (name && name.trim() && !db.trips[name.trim()]) {
        const cleanName = name.trim();
        db.trips[cleanName] = [];
        db.activeTrip = cleanName;
        save();
        init();
      }
    }

    function renameTrip() {
      const current = db.activeTrip;
      const newName = prompt("Rename current trip:", current);
      if (newName && newName.trim() && newName.trim() !== current) {
        const cleanName = newName.trim();
        db.trips[cleanName] = db.trips[current];
        delete db.trips[current];
        db.activeTrip = cleanName;
        save();
        init();
      }
    }

    function deleteTrip() {
      const tripNames = Object.keys(db.trips);
      if (tripNames.length <= 1) {
        alert("Cannot delete the only remaining trip.");
        return;
      }
      if (confirm(`Delete trip "${db.activeTrip}" and all its items?`)) {
        delete db.trips[db.activeTrip];
        db.activeTrip = Object.keys(db.trips)[0];
        save();
        init();
      }
    }

    function addItem(e) {
      e.preventDefault();
      const catInput = document.getElementById('newCategory');
      const nameInput = document.getElementById('newName');
      const notesInput = document.getElementById('newNotes');
      const items = db.trips[db.activeTrip] || [];

      const maxPriority = items.length ? Math.max(...items.map(i => i.priority || 0)) : 0;

      const newItem = {
        id: Date.now(),
        category: catInput.value || "General",
        name: nameInput.value.trim(),
        notes: notesInput.value.trim(),
        completed: false,
        priority: maxPriority + 1
      };

      items.push(newItem);
      save();

      // Clear input fields, keep category & focus to prevent scroll jumps
      nameInput.value = '';
      notesInput.value = '';
      nameInput.focus();
      renderList();
    }

    function toggleStatus(id) {
      const items = db.trips[db.activeTrip];
      const target = items.find(i => i.id === id);
      if (target) {
        target.completed = !target.completed;
        save();
        renderList();
      }
    }

    function moveItem(id, direction) {
      const items = db.trips[db.activeTrip];
      const target = items.find(i => i.id === id);
      if (!target) return;

      const sameGroup = items
        .filter(i => i.completed === target.completed)
        .sort((a, b) => a.priority - b.priority);

      const idx = sameGroup.findIndex(i => i.id === id);
      const swapIdx = direction === 'up' ? idx - 1 : idx + 1;

      if (swapIdx >= 0 && swapIdx < sameGroup.length) {
        const tempPri = sameGroup[idx].priority;
        sameGroup[idx].priority = sameGroup[swapIdx].priority;
        sameGroup[swapIdx].priority = tempPri;

        if (sameGroup[idx].priority === sameGroup[swapIdx].priority) {
          sameGroup[idx].priority += (direction === 'up' ? -1 : 1);
        }

        save();
        renderList();
      }
    }

    function editItem(id) {
      const items = db.trips[db.activeTrip];
      const target = items.find(i => i.id === id);
      if (!target) return;

      const newName = prompt("Edit Item / Activity Name:", target.name);
      if (newName === null) return;

      const newCat = prompt("Edit Category (General, Logistics, Activities, Gear, Shopping, Lodging, Docs):", target.category);
      if (newCat === null) return;

      const newNotes = prompt("Edit Address / Comments (optional):", target.notes || "");
      if (newNotes === null) return;

      target.name = newName.trim();
      target.category = newCat.trim() || "General";
      target.notes = newNotes.trim();
      save();
      renderList();
    }

    function deleteItem(id) {
      const items = db.trips[db.activeTrip];
      const target = items.find(i => i.id === id);
      if (!target) return;

      if (confirm(`Delete "${target.name}"?`)) {
        db.trips[db.activeTrip] = items.filter(i => i.id !== id);
        save();
        renderList();
      }
    }

    function renderList() {
      const container = document.getElementById('itemList');
      const items = db.trips[db.activeTrip] || [];

      // Sort Order: Pending First -> Priority Ascending
      items.sort((a, b) => {
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        return (a.priority || 0) - (b.priority || 0);
      });

      const pendingGroup = items.filter(i => !i.completed);
      const completedGroup = items.filter(i => i.completed);

      container.innerHTML = items.map(item => {
        const group = item.completed ? completedGroup : pendingGroup;
        const groupIdx = group.findIndex(i => i.id === item.id);
        const isFirst = groupIdx === 0;
        const isLast = groupIdx === group.length - 1;

        return `
          <div class="row ${item.completed ? 'completed' : ''}">
            <div class="reorder">
              <button class="reorder-btn" onclick="moveItem(${item.id}, 'up')" ${isFirst ? 'disabled' : ''}>▲</button>
              <button class="reorder-btn" onclick="moveItem(${item.id}, 'down')" ${isLast ? 'disabled' : ''}>▼</button>
            </div>
            <div class="item-details">
              <div class="item-header">
                <span class="item-title">${item.name}</span>
                <span class="category-badge">${item.category}</span>
              </div>
              ${item.notes ? `<div class="item-notes">${item.notes}</div>` : ''}
            </div>
            <button class="toggle ${item.completed ? 'done' : 'pending'}" onclick="toggleStatus(${item.id})">
              ${item.completed ? 'DONE' : 'PACK'}
            </button>
            <div class="actions">
              <button class="icon-btn" onclick="editItem(${item.id})">✏️</button>
              <button class="icon-btn" onclick="deleteItem(${item.id})">🗑️</button>
            </div>
          </div>
        `;
      }).join('');
    }

    init();
  </script>
</body>
</html>
